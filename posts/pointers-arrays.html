      <h2>核心思想</h2>
      <p>数组名在大多数表达式中会退化为指针，指针运算本质是按元素大小进行地址偏移。理解地址偏移能帮助你写出更高效的 C 代码并排查内存错误。</p>

      <h2>例子</h2>
      <pre style="background:rgba(0,0,0,0.06);padding:12px;border-radius:6px;">int arr[3] = {10,20,30};
int *p = arr; // 指向 arr[0]
// p + 1 指向 arr[1] 的地址（偏移 sizeof(int)）
</pre>
